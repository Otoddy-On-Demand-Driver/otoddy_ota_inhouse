name: otoddyota
description: Over-The-Air (OTA) Code Push client by OTODDY for Flutter applications with automatic engine patch detection.
version: 1.0.4
homepage: https://otoddy.com
repository: https://github.com/MohitMakhijani/otoddy_ota_inhouse
issue_tracker: https://github.com/MohitMakhijani/otoddy_ota_inhouse/issues

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.2
  restart_app: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.otoddy.otoddyota
        pluginClass: OtoddyOtaPlugin
